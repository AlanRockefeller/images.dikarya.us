{% extends "base.html" %}
{% block title %}Log in · {{ site_name }}{% endblock %}
{% block content %}
<section class="auth">
  <h1>Log in</h1>
  <p>Welcome back. New here? <a href="/register?next={{ next|urlencode }}">Create an account</a>.</p>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email <input name="email" type="email" value="{{ email }}" autocomplete="email" required maxlength="320" autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
    <button class="button" type="submit">Log in</button>
  </form>
</section>
{% endblock %}
