{% extends "base.html" %}
{% block title %}Create an account · {{ site_name }}{% endblock %}
{% block content %}
<section class="auth">
  <h1>Create an account</h1>
  <p>An account lets you rank photos. Already have one? <a href="/login?next={{ next|urlencode }}">Log in</a>.</p>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="hidden" name="stamp" value="{{ form_stamp }}">
    <div class="form__trap" aria-hidden="true">
      <label>Website (leave this empty) <input name="website" type="text" tabindex="-1" autocomplete="off"></label>
    </div>
    <label>Name <input name="name" type="text" value="{{ name }}" autocomplete="name" required maxlength="120" autofocus></label>
    <label>Email <input name="email" type="email" value="{{ email }}" autocomplete="email" required maxlength="320"></label>
    <label>Password <input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="1024">
      <small>At least 10 characters.</small></label>
    <button class="button" type="submit">Create account</button>
  </form>
</section>
{% endblock %}
