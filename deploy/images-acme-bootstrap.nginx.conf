# Temporary HTTP-only vhost used to issue the certificate for both hostnames.
# Replace it with images.nginx.conf after Certbot creates the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name images.dikarya.us image.dikarya.us;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
