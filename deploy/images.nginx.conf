# Install as a new vhost file; do not replace the host's global nginx config.
# The certificate must include both hostnames before enabling the TLS blocks.
server {
    listen 80;
    listen [::]:80;
    server_name image.dikarya.us;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://images.dikarya.us$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name images.dikarya.us;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://images.dikarya.us$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name image.dikarya.us;

    ssl_certificate /etc/letsencrypt/live/images.dikarya.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/images.dikarya.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://images.dikarya.us$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name images.dikarya.us;

    ssl_certificate /etc/letsencrypt/live/images.dikarya.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/images.dikarya.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
