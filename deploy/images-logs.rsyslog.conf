# Copies the app's activity, attack and scanner logs from the journal into
# files under /var/log/images/ (readable by group adm). Optional: the journal
# keeps them either way. Install with:
#   sudo install -d -o syslog -g adm -m 2750 /var/log/images
#   sudo install -m 0644 deploy/images-logs.rsyslog.conf /etc/rsyslog.d/30-images.conf
#   sudo install -m 0644 deploy/images-logs.logrotate /etc/logrotate.d/images
#   sudo systemctl restart rsyslog
:programname, isequal, "images-activity" /var/log/images/activity.log
& stop
:programname, isequal, "images-attack" /var/log/images/attack.log
& stop
:programname, isequal, "images-scanner" /var/log/images/scanner.log
& stop
